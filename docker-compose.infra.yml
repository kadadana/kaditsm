name: dev-kaditsm

services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-kaditsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-kaditsmdev}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-kaditsmpass}
      POSTGRES_DB: postgres
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      TENANT_DB_NAME: ${TENANT_DB_NAME:-tenant_db}
      TENANT_DB_USER: ${TENANT_DB_USER:-tenant_user}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-tenant_pass}
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      USER_DB_USER: ${USER_DB_USER:-user_user}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user_pass}
      PERMISSION_DB_NAME: ${PERMISSION_DB_NAME:-permission_db}
      PERMISSION_DB_USER: ${PERMISSION_DB_USER:-permission_user}
      PERMISSION_DB_PASSWORD: ${PERMISSION_DB_PASSWORD:-permission_pass}
      SPICEDB_DB_NAME: ${SPICEDB_DB_NAME:-spicedb}
      SPICEDB_DB_USER: ${SPICEDB_DB_USER:-spicedb_user}
      SPICEDB_DB_PASSWORD: ${SPICEDB_DB_PASSWORD:-spicedb_pass}
    ports:
      - "${DEV_POSTGRES_PORT}:5432"
    volumes:
      - dev-kaditsm-postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-kaditsmdev} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dev-kaditsm-gateway-redis
    restart: unless-stopped
    ports:
      - "${DEV_GATEWAY_REDIS_PORT}:6379"
    volumes:
      - dev-kaditsm-gateway-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis2:
    image: redis:7-alpine
    container_name: dev-kaditsm-auth-redis
    restart: unless-stopped
    ports:
      - "${DEV_AUTH_REDIS_PORT}:6379"
    volumes:
      - dev-kaditsm-auth-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dev-kaditsm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${DEV_RABBITMQ_PORT}:5672"
      - "${DEV_RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - dev-kaditsm-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5672'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  kafka:
    image: apache/kafka:3.9.0
    container_name: dev-kaditsm-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:${DEV_KAFKA_PORT},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DEV_KAFKA_HOST:?set DEV_KAFKA_HOST}:${DEV_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms96m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20"
    ports:
      - "${DEV_KAFKA_PORT}:${DEV_KAFKA_PORT}"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 192M
    volumes:
      - dev-kaditsm-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  spicedb-migrate:
    image: authzed/spicedb:latest
    command: migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_DB_USER:-spicedb_user}:${SPICEDB_DB_PASSWORD:-spicedb_pass}@postgres:5432/${SPICEDB_DB_NAME:-spicedb}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: authzed/spicedb:latest
    command: serve
    container_name: dev-kaditsm-spicedb
    restart: unless-stopped
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_DB_USER:-spicedb_user}:${SPICEDB_DB_PASSWORD:-spicedb_pass}@postgres:5432/${SPICEDB_DB_NAME:-spicedb}?sslmode=disable
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:?set SPICEDB_GRPC_PRESHARED_KEY}
    ports:
      - "${DEV_SPICEDB_PORT:-50051}:50051"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
  spicedb-schema:
    image: authzed/zed:latest
    command:
      - schema
      - write
      - /schema/schema.zed
      - --endpoint
      - spicedb:50051
      - --token
      - ${SPICEDB_GRPC_PRESHARED_KEY:?set SPICEDB_GRPC_PRESHARED_KEY}
      - --insecure
    volumes:
      - ./schema:/schema:ro
    depends_on:
      spicedb:
        condition: service_started
    restart: on-failure

volumes:
  dev-kaditsm-postgres-data:
  dev-kaditsm-gateway-redis-data:
  dev-kaditsm-rabbitmq-data:
  dev-kaditsm-auth-redis-data:
  dev-kaditsm-kafka-data:
