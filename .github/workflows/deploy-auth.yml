name: Deploy Auth Service

on:
  push:
    branches:
      - main
    paths:
      - "api/v1/auth/**"
      - ".github/workflows/deploy-auth.yml"

jobs:
  deploy:
    runs-on: self-hosted
    environment: auth-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Auth Service
        working-directory: ./api/v1/auth
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          SERVICE_PORT: ${{ vars.SERVICE_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          RABBITMQ_PORT: ${{vars.RABBITMQ_PORT}}
          RABBITMQ_USER: ${{vars.RABBITMQ_USER}}
          RABBITMQ_MGMT_PORT: ${{vars.RABBITMQ_MGMT_PORT}}
          RABBITMQ_PASS: ${{secrets.RABBITMQ_PASS}}
          JWT_PRIVATE_KEY: ${{secrets.JWT_PRIVATE_KEY}}
          JWT_KEY_ID: ${{secrets.JWT_KEY_ID}}

        run: |
          docker network inspect kaditsm-network >/dev/null 2>&1 || docker network create kaditsm-network

          docker compose up -d --build auth-service --wait --wait-timeout 60
          
          docker image prune -f