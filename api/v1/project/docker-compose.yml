services:
  project-postgres:
    image: postgres:16-alpine
    container_name: project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - project-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - project-network

  project-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_service
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN   
      PORT: 8080
      DB_HOST: project-postgres
      DB_PORT: 5432
      DB_NAME: project_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      SPRING_JPA_OPEN_IN_VIEW: "false"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      project-postgres:
        condition: service_healthy
    networks:
      - project-network
      - kaditsm-network

volumes:
  project-postgres-data:

networks:
  project-network:
    driver: bridge
  kaditsm-network:
    name: kaditsm-network
    external: true