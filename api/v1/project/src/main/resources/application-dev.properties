# SERVER CONFIGURATION
server.port=${PORT:8080}
server.servlet.context-path=/

# DATASOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST:192.168.1.210}:${DB_PORT:5431}/${DB_NAME:project_db}
spring.datasource.username=${DB_USER:KADITSMTEST}
spring.datasource.password=${DB_PASSWORD:KADITSMPASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SWAGGER / OPENAPI DOCS
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

#JWT CONFIGURATION
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URL}
app.jwt.issuer=${JWT_ISSUER}

# LOGGING
logging.level.root=INFO
logging.level.com.kaditsm.project=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always