version: '3.8'

services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  auth-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auth-rabbitmq
    hostname: auth-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - auth-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5672'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      auth-network:
        aliases:
          - auth-rabbitmq
      kaditsm-network:
        aliases:
          - kaditsm-rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: auth-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_ISSUER: ${JWT_ISSUER}
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 12s
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-rabbitmq:
        condition: service_healthy
    networks:
      - auth-network
      - kaditsm-network

volumes:
  auth-postgres-data:
  auth-redis-data:
  auth-rabbitmq-data:

networks:
  auth-network:
    driver: bridge
  kaditsm-network:
    name: kaditsm-network
    external: true
