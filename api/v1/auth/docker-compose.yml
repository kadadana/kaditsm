services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - auth-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - auth-redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 5
    networks:
      - auth-network

  auth-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auth-rabbitmq
    hostname: auth-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - auth-rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 5672" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      auth-network:
        aliases:
          - auth-rabbitmq
      kaditsm-network:
        aliases:
          - kaditsm-rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: auth-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_ISSUER: ${JWT_ISSUER}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 450M
        reservations:
          memory: 200M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      auth-rabbitmq:
        condition: service_healthy
    networks:
      - auth-network
      - kaditsm-network

volumes:
  auth-postgres-data:
  auth-redis-data:
  auth-rabbitmq-data:

networks:
  auth-network:
    driver: bridge
  kaditsm-network:
    name: kaditsm-network
    external: true
