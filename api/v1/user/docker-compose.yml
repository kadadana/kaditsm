services:
  user-postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: user_db
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d user_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [ kaditsm-network ]

  user-kafka:
    image: apache/kafka:3.9.0
    container_name: user-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://user-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@user-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - user-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [ kaditsm-network ]

  user-service:
    build: .
    container_name: user-service
    restart: unless-stopped
    environment:
      ConnectionStrings__UserDb: Host=user-postgres;Port=5432;Database=user_db;Username=${DB_USER};Password=${DB_PASS}
      Jwt__JwksUrl: ${JWT_JWKS_URL}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__RequireHttpsMetadata: ${JWT_REQUIRE_HTTPS:-true}
      Kafka__BootstrapServers: user-kafka:9092
      Database__MigrateOnStartup: "true"
    ports:
      - "${SERVICE_PORT}:8080"
    depends_on:
      user-postgres:
        condition: service_healthy
      user-kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ kaditsm-network ]

networks:
  kaditsm-network:
    name: kaditsm-network
    external: true

volumes:
  user-postgres-data:
  user-kafka-data:
